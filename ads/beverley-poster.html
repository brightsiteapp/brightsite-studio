<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2048px;height:1536px;background:#F7F2EC;font-family:'Avenir Next','Nunito Sans',Helvetica,Arial,sans-serif;color:#1F2530;overflow:hidden}
  .poster{position:relative;width:2048px;height:1536px;padding:225px 110px 90px;
    background:radial-gradient(1100px 800px at 88% 8%,#DCE9FD 0%,rgba(220,233,253,0) 65%),#F7F2EC}
  .logo{position:absolute;left:110px;top:70px}
  .logo img{height:54px;display:block}
  .left{width:1150px}
  h1{font-size:176px;line-height:.95;font-weight:900;letter-spacing:-3px}
  h1 .free{color:#3B82F6}
  h1 small{display:block;font-size:84px;letter-spacing:-1px;color:#1F2530;margin-top:22px;font-weight:800;line-height:1.05}
  .perks{margin-top:46px;display:flex;flex-direction:column;gap:18px}
  .perks div{font-size:68px;font-weight:800;display:flex;align-items:center;gap:22px}
  .perks i{font-style:normal;width:66px;height:66px;border-radius:50%;background:#3B82F6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;flex:none}
  .perks em{font-style:normal;color:#FFD84D}
  .qr{position:absolute;right:110px;top:380px;width:640px;background:#fff;border:3px solid #E7DED2;box-shadow:0 30px 70px rgba(31,37,48,.14);border-radius:44px;padding:50px 50px 38px;text-align:center;color:#1F2530}
  .qr img{width:540px;height:540px;display:block;image-rendering:pixelated}
  .qr .scan{font-size:56px;font-weight:900;margin-top:26px;line-height:1.1}
  .qr .code{white-space:nowrap;margin-top:16px;font-size:36px;font-weight:700;color:#616D79}
  .qr .code b{font-family:ui-monospace,Menlo,monospace;font-size:42px;letter-spacing:3px;color:#1D4FD8;background:#EAF2FF;border-radius:12px;padding:2px 16px;margin-left:8px}
  .save{display:inline-block;margin-top:54px;background:#3B82F6;color:#fff;font-size:96px;font-weight:900;border-radius:28px;padding:10px 48px;transform:rotate(-2deg)}
  .foot{position:absolute;left:110px;bottom:70px;font-size:44px;font-weight:700;color:#616D79}
  .foot b{color:#1F2530}
</style></head>
<body><div class="poster">
  <div class="logo"><img src="../img/brightsite-logo.png"></div>
  <div class="left">
    <h1><span class="free">Free</span> website<small>for your small business</small></h1>
    <div class="perks">
      <div><i>&#10003;</i>Free domain</div>
      <div><i>&#10003;</i>Free logo</div>
      <div><i>&#10003;</i>Free Pro upgrade</div>
    </div>
    <div class="save">Save &pound;200+</div>
  </div>
  <div class="qr">
    <img src="beverley-qr.svg">
    <div class="scan">Scan to claim</div>
    <div class="code">Use code<b>ANYTIMEBEV</b></div>
  </div>
  <div class="foot">In partnership with <b>Anytime Fitness Beverley</b></div>
</div></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2048px;height:1536px;background:#0B1B3A;font-family:'Avenir Next','Nunito Sans',Helvetica,Arial,sans-serif;color:#fff;overflow:hidden}
  .poster{position:relative;width:2048px;height:1536px;padding:225px 110px 90px;
    background:radial-gradient(1200px 800px at 85% 10%,#1D4FD8 0%,rgba(29,79,216,0) 60%),linear-gradient(160deg,#0B1B3A 0%,#102A5C 100%)}
  .logo{position:absolute;left:110px;top:70px;background:#fff;border-radius:22px;padding:20px 30px}
  .logo img{height:54px;display:block}
  .left{width:1150px}
  h1{font-size:176px;line-height:.95;font-weight:900;letter-spacing:-3px}
  h1 .free{color:#FFD84D}
  h1 small{display:block;font-size:84px;letter-spacing:-1px;color:#7DB2FF;margin-top:22px;line-height:1.05}
  .perks{margin-top:46px;display:flex;flex-direction:column;gap:18px}
  .perks div{font-size:68px;font-weight:800;display:flex;align-items:center;gap:22px}
  .perks i{font-style:normal;width:66px;height:66px;border-radius:50%;background:#FFD84D;color:#0B1B3A;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;flex:none}
  .perks em{font-style:normal;color:#FFD84D}
  .qr{position:absolute;right:110px;top:380px;width:640px;background:#fff;border-radius:44px;padding:50px 50px 38px;text-align:center;color:#0B1B3A}
  .qr img{width:540px;height:540px;display:block;image-rendering:pixelated}
  .qr .scan{font-size:56px;font-weight:900;margin-top:26px;line-height:1.1}
  .qr .code{margin-top:16px;font-size:40px;font-weight:700;color:#3B6FD8}
  .qr .code b{font-family:ui-monospace,Menlo,monospace;font-size:46px;letter-spacing:4px;color:#0B1B3A;background:#FFD84D;border-radius:12px;padding:2px 16px;margin-left:8px}
  .save{display:inline-block;margin-top:54px;background:#FFD84D;color:#0B1B3A;font-size:96px;font-weight:900;border-radius:28px;padding:10px 48px;transform:rotate(-2deg)}
  .foot{position:absolute;left:110px;bottom:70px;font-size:44px;font-weight:700;color:#9EC5FA}
  .foot b{color:#fff}
</style></head>
<body><div class="poster">
  <div class="logo"><img src="../img/brightsite-logo.png"></div>
  <div class="left">
    <h1><span class="free">Free</span> website<small>for your small business</small></h1>
    <div class="perks">
      <div><i>&#10003;</i>Free domain</div>
      <div><i>&#10003;</i>Free logo</div>
      <div><i>&#10003;</i>Free Pro upgrade</div>
    </div>
    <div class="save">Save &pound;200+</div>
  </div>
  <div class="qr">
    <img src="beverley-qr.svg">
    <div class="scan">Scan to claim</div>
    <div class="code">Use code<b>ANYTIMEBEV</b></div>
  </div>
  <div class="foot">In partnership with <b>Anytime Fitness Beverley</b></div>
</div></body></html>

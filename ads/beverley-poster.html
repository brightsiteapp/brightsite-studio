<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2048px;height:1536px;background:#0B1B3A;font-family:'Avenir Next','Nunito Sans',Helvetica,Arial,sans-serif;color:#fff;overflow:hidden}
  .poster{position:relative;width:2048px;height:1536px;padding:230px 110px 90px;
    background:radial-gradient(1200px 800px at 85% 10%,#1D4FD8 0%,rgba(29,79,216,0) 60%),linear-gradient(160deg,#0B1B3A 0%,#102A5C 100%)}
  /* top ~220px is kept clear: the treadmill overlays a Bluetooth banner there */
  .logo{position:absolute;left:110px;top:70px;background:#fff;border-radius:22px;padding:20px 30px}
  .logo img{height:54px;display:block}
  .left{width:1110px}
  h1{font-size:150px;line-height:.98;font-weight:900;letter-spacing:-2px}
  h1 em{font-style:normal;color:#7DB2FF}
  .sub{font-size:52px;line-height:1.25;margin-top:34px;color:#D5E3FA;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:26px;margin-top:46px;background:#3B82F6;border-radius:28px;padding:26px 38px}
  .badge b{font-size:56px;font-weight:900;letter-spacing:1px}
  .badge span{font-family:ui-monospace,Menlo,monospace;font-size:56px;font-weight:800;letter-spacing:5px;background:#fff;color:#1D4FD8;border-radius:16px;padding:6px 24px}
  .qr{position:absolute;right:110px;top:300px;width:690px;background:#fff;border-radius:44px;padding:56px 56px 40px;text-align:center;color:#0B1B3A}
  .qr img{width:578px;height:578px;display:block;image-rendering:pixelated}
  .qr .scan{font-size:58px;font-weight:900;margin-top:30px;line-height:1.1}
  .qr .url{font-size:42px;font-weight:700;color:#3B6FD8;margin-top:10px}
  .foot{position:absolute;left:110px;bottom:78px;font-size:46px;font-weight:700;color:#9EC5FA;letter-spacing:.5px}
  .foot b{color:#fff}
</style></head>
<body><div class="poster">
  <div class="logo"><img src="../img/brightsite-logo.png"></div>
  <div class="left">
    <h1>Your business needs a <em>website.</em></h1>
    <p class="sub">We build it free. Subscribe and your first domain is on us.</p>
    <div class="badge"><b>FREE DOMAIN</b><span>ANYTIMEBEV</span></div>
  </div>
  <div class="qr">
    <img src="beverley-qr.svg">
    <div class="scan">Scan to claim</div>
    <div class="url">brightsite.app/beverley</div>
  </div>
  <div class="foot">In partnership with <b>Anytime Fitness Beverley</b></div>
</div></body></html>

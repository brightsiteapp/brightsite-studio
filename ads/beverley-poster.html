<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2048px;height:1536px;background:#F7F2EC;font-family:'Avenir Next','Nunito Sans',Helvetica,Arial,sans-serif;color:#1F2530;overflow:hidden}
  .poster{position:relative;width:2048px;height:1536px;
    background:radial-gradient(1100px 800px at 88% 8%,#DCE9FD 0%,rgba(220,233,253,0) 65%),#F7F2EC}
  /* top ~220px stays clear: the treadmill overlays a Bluetooth banner there */
  .logo{position:absolute;left:110px;top:62px;display:flex;align-items:center;gap:26px}
  .logo .word{height:54px;display:block}
  .logo .sep{width:3px;height:56px;background:#D9CFC1;border-radius:2px}
  .logo .appicon{width:68px;height:68px;border-radius:16px;display:block;box-shadow:0 6px 16px rgba(59,130,246,.35)}
  .logo .apptxt{font-size:30px;line-height:1.12;font-weight:700;color:#616D79;white-space:nowrap}
  .logo .apptxt b{display:block;font-size:34px;font-weight:900;color:#1F2530}
  h1{position:absolute;left:110px;top:225px;font-size:250px;line-height:.9;font-weight:900;letter-spacing:-6px;white-space:nowrap}
  h1 .free{color:#3B82F6}
  .sub{position:absolute;left:110px;top:468px;font-size:84px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
  .perks{position:absolute;left:110px;top:614px;display:flex;gap:34px}
  .perks div{font-size:44px;font-weight:800;display:flex;align-items:center;gap:12px;white-space:nowrap}
  .perks i{font-style:normal;width:46px;height:46px;border-radius:50%;background:#3B82F6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;flex:none}
  .sites{position:absolute;left:110px;top:716px;display:flex;gap:44px;align-items:center}
  .site{width:700px;background:#fff;border-radius:18px;overflow:hidden;border:3px solid #E7DED2;box-shadow:0 20px 44px rgba(31,37,48,.14)}
  .site .bar{height:30px;background:#EFE8DD;display:flex;align-items:center;gap:8px;padding:0 14px}
  .site .bar i{width:10px;height:10px;border-radius:50%;background:#C9BFB0;display:block}
  .site img{display:block;width:100%;height:437px;object-fit:cover;object-position:top}
  .col{position:absolute;right:110px;top:470px;width:600px}
  .save{background:#3B82F6;color:#fff;font-size:84px;font-weight:900;text-align:center;border-radius:28px;padding:6px 0 10px;line-height:1.1}
  .qr{margin-top:26px;background:#fff;border:3px solid #E7DED2;box-shadow:0 30px 70px rgba(31,37,48,.14);border-radius:44px;padding:46px 50px 34px;text-align:center}
  .qr img{width:500px;height:500px;display:block;image-rendering:pixelated}
  .qr .scan{font-size:56px;font-weight:900;margin-top:26px;line-height:1.1}
  .qr .code{white-space:nowrap;margin-top:16px;font-size:36px;font-weight:700;color:#616D79}
  .qr .code b{font-family:ui-monospace,Menlo,monospace;font-size:42px;letter-spacing:3px;color:#1D4FD8;background:#EAF2FF;border-radius:12px;padding:2px 16px;margin-left:8px}
  .tp{position:absolute;left:110px;bottom:170px;display:flex;align-items:center;gap:26px}
  .tp-stars{display:flex;gap:8px}
  .tp-stars svg{width:64px;height:64px;display:block}
  .tp-text{font-size:52px;font-weight:600;color:#616D79}
  .tp-text b{color:#1F2530;font-weight:900}
  .foot{position:absolute;left:110px;bottom:70px;font-size:44px;font-weight:700;color:#616D79}
  .foot b{color:#1F2530}
  .phone{width:236px;height:490px;background:#1F2530;border-radius:46px;padding:11px;box-shadow:0 20px 44px rgba(31,37,48,.22);position:relative}
  .phone .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#EAE3D9;display:flex;flex-direction:column;padding-top:34px}

  .phone img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:top}
</style></head>
<body><div class="poster">
  <div class="logo"><img class="word" src="../img/brightsite-logo.png"><span class="sep"></span><img class="appicon" src="../img/app-logo.png"><span class="apptxt">Also on the<b>App Store</b></span></div>
  <h1><span class="free">Free</span> website</h1>
  <div class="sub">Get your business in shape</div>
  <div class="perks">
    <div><i>&#10003;</i>Free domain</div>
    <div><i>&#10003;</i>Free logo</div>
    <div><i>&#10003;</i>Free Pro upgrade</div>
  </div>
  <div class="sites">
    <div class="phone"><div class="screen"><img src="meraki-mobile.jpg"></div></div>
    <div class="site"><div class="bar"><i></i><i></i><i></i></div><img src="an-automotive-hero.jpg"></div>
  </div>
  <div class="col">
    <div class="save">Save &pound;200+</div>
    <div class="qr">
      <img src="beverley-qr.svg">
      <div class="scan">Scan to claim</div>
      <div class="code">Use code<b>ANYTIMEBEV</b></div>
    </div>
  </div>
  <div class="tp"><span class="tp-stars"><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="#00b67a" rx="1.5"/><path d="M10 3.5l1.8 4 4.4.6-3.2 3.2.8 4.5-3.8-2-3.8 2 .8-4.5-3.2-3.2 4.4-.6z" fill="#fff"/></svg><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="#00b67a" rx="1.5"/><path d="M10 3.5l1.8 4 4.4.6-3.2 3.2.8 4.5-3.8-2-3.8 2 .8-4.5-3.2-3.2 4.4-.6z" fill="#fff"/></svg><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="#00b67a" rx="1.5"/><path d="M10 3.5l1.8 4 4.4.6-3.2 3.2.8 4.5-3.8-2-3.8 2 .8-4.5-3.2-3.2 4.4-.6z" fill="#fff"/></svg><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="#00b67a" rx="1.5"/><path d="M10 3.5l1.8 4 4.4.6-3.2 3.2.8 4.5-3.8-2-3.8 2 .8-4.5-3.2-3.2 4.4-.6z" fill="#fff"/></svg><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="#00b67a" rx="1.5"/><path d="M10 3.5l1.8 4 4.4.6-3.2 3.2.8 4.5-3.8-2-3.8 2 .8-4.5-3.2-3.2 4.4-.6z" fill="#fff"/></svg></span><span class="tp-text">Rated <b>Excellent</b> on Trustpilot</span></div>
  <div class="foot">In partnership with <b>Anytime Fitness Beverley</b></div>
</div></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading your preview…</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;color:#6f635c;background:#F7F2EC}</style>
</head>
<body>
<p id="fallback">Loading your preview…</p>
<script src="template-designs.js?v=20260915-1"></script>
<script src="fresh-templates.js?v=20260909-4"></script>
<script src="demo-generator.js?v=20260915-1"></script>
<script>
// A publicly-shareable preview link: the site's answers are encoded in the
// `d` query param (see buildPreviewUrl() in index.html) rather than stored
// server-side, so this page just re-runs the same generator client-side to
// reproduce the exact same site — no backend or expiring link involved.
(function () {
  var params = new URLSearchParams(location.search);
  var raw = params.get('d');
  var fallback = document.getElementById('fallback');
  if (!raw) {
    fallback.textContent = "This preview link is missing its data — ask your designer to resend it.";
    return;
  }
  try {
    var data = JSON.parse(decodeURIComponent(raw));
    var html = buildDemoHTML(data);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    fallback.textContent = "This preview link couldn't be loaded — ask your designer to resend it.";
  }
})();
</script>
</body>
</html>

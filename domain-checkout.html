<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Domain Checkout · BrightSite</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #2F7DED;
    --ink: #1D252B;
    --muted: #69747B;
    --line: #E8E4DE;
    --bg: #F5F2EE;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .logo span { color: #fff; font-size: 14px; }
  .header-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .header-secure { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }

  .container { padding: 20px 16px 48px; max-width: 480px; margin: 0 auto; }

  .domain-summary {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .domain-summary-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  .domain-row { display: flex; align-items: center; gap: 10px; }
  .domain-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; flex-shrink: 0; }
  .domain-info { flex: 1; }
  .domain-name { font-size: 15px; font-weight: 700; color: var(--ink); }
  .domain-price { font-size: 12px; color: var(--muted); margin-top: 2px; }

  #loading { text-align: center; padding: 48px 0; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--muted); }

  #error-msg { display: none; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 12px; padding: 14px 16px; font-size: 13px; color: #DC2626; margin-bottom: 16px; }
  #checkout-wrap { background: #fff; border-radius: 14px; overflow: hidden; }

  .success-box { display: none; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 14px; padding: 28px 20px; text-align: center; }
  .success-icon { font-size: 36px; margin-bottom: 12px; }
  .success-title { font-size: 18px; font-weight: 700; color: #15803D; margin-bottom: 6px; }
  .success-body { font-size: 14px; color: #166534; }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>✦</span></div>
  <span class="header-title">BrightSite Checkout</span>
  <span class="header-secure">🔒 Secure</span>
</div>

<div class="container">
  <div class="domain-summary">
    <div class="domain-summary-label">Your domain</div>
    <div class="domain-row">
      <div class="domain-icon">🌐</div>
      <div class="domain-info">
        <div class="domain-name" id="domain-name">—</div>
        <div class="domain-price" id="domain-price">1-year registration</div>
      </div>
    </div>
  </div>

  <div id="error-msg"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading secure checkout…</div>
  </div>
  <div id="checkout-wrap" style="display:none"></div>
  <div class="success-box" id="success-box">
    <div class="success-icon">✅</div>
    <div class="success-title">Domain registered!</div>
    <div class="success-body">Your domain is being set up. We'll connect it to your website within 24 hours.</div>
  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
(function () {
  var PUBLISHABLE_KEY = 'pk_live_51UFf7iGqCP7G2YApFHjoKMHkxsEIrf0SJiBpxeTR2MRZ4zs26OQ5jjBClWu8OvZXGXAZvMectFW0zLEuGFFKC7CA008zYaYMzc';

  var params  = new URLSearchParams(location.search);
  var domain  = params.get('domain') || '';
  var email   = params.get('email') || '';
  var slug    = params.get('slug') || '';

  document.getElementById('domain-name').textContent = domain || '—';

  var checkoutEl = document.getElementById('checkout-wrap');
  var loadingEl  = document.getElementById('loading');
  var errorEl    = document.getElementById('error-msg');
  var successEl  = document.getElementById('success-box');
  var checkout   = null;

  if (params.get('domain_success') === '1') {
    loadingEl.style.display = 'none';
    document.querySelector('.domain-summary').style.display = 'none';
    successEl.style.display = 'block';
  } else if (!domain) {
    loadingEl.style.display = 'none';
    errorEl.textContent = 'No domain specified.';
    errorEl.style.display = 'block';
  } else {
    var returnUrl = 'https://brightsite.app/domain-checkout?domain_success=1&domain=' + encodeURIComponent(domain);
    fetch('https://api.brightsite.app/api/create-domain-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain: domain, email: email, slug: slug, return_url: returnUrl })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.priceInPence) {
          document.getElementById('domain-price').textContent =
            '£' + (data.priceInPence / 100).toFixed(2) + ' · 1-year registration';
        }
        if (!data.clientSecret) throw new Error(data.error || 'No client secret');
        var stripe = Stripe(PUBLISHABLE_KEY);
        return stripe.initEmbeddedCheckout({ clientSecret: data.clientSecret });
      })
      .then(function (co) {
        checkout = co;
        loadingEl.style.display = 'none';
        checkoutEl.style.display = 'block';
        co.mount(checkoutEl);
      })
      .catch(function (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Could not load checkout: ' + err.message;
        errorEl.style.display = 'block';
      });
  }
})();
</script>
</body>
</html>

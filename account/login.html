<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Account — BrightSite</title>
<meta name="description" content="Log in to manage your BrightSite website — services, prices, contact info and photos.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.png" type="image/png">
<meta name="theme-color" content="#F7F2EC">
<link rel="stylesheet" href="../styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .acct-wrap{width:100%;max-width:420px}
  .acct-brand{display:flex;justify-content:center;margin-bottom:16px}
  .acct-brand img{height:34px;width:auto}
  .acct-card{padding:clamp(18px,4vw,26px);border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 12px 30px rgba(23,32,31,.05)}
  .acct-card h1{font-family:var(--display);font-size:clamp(19px,3vw,24px);font-weight:600;line-height:1.15;margin-bottom:4px}
  .acct-card>p.sub{color:var(--muted);font-size:13.5px;line-height:1.45;margin-bottom:14px}
  .acct-field{margin-bottom:10px}
  .acct-field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
  .acct-field input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:15px;outline:none;transition:border-color .18s ease,box-shadow .18s ease}
  .acct-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .acct-submit{width:100%;margin-top:10px;min-height:44px;padding:0 21px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
  .acct-submit:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(59,130,246,.28)}
  .acct-submit:disabled{opacity:.7;cursor:wait;transform:none;box-shadow:none}
  .acct-status{min-height:18px;margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.4}
  .acct-status.ok{color:var(--accent);font-weight:600}
  .acct-status.err{color:#b23b2c}
  .acct-toggle{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
  .acct-toggle button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .acct-divider{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .acct-divider::before,.acct-divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .acct-google{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .18s ease,box-shadow .18s ease}
  .acct-google:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(23,32,31,.06)}
  .acct-google svg{width:18px;height:18px;flex:none}
  .acct-back{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--muted);text-decoration:none}
  .acct-back:hover{color:var(--ink)}
  .acct-prefill-email{display:none;margin-bottom:14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;color:var(--muted)}
  .acct-prefill-email.show{display:block}
  .acct-prefill-email strong{color:var(--ink);font-weight:700}
  .acct-prefill-email button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .acct-pwd-show{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted)}
  .acct-pwd-show input{width:auto;margin:0}
  .acct-pwd-show label{cursor:pointer}
  .acct-forgot{display:block;margin:8px 0 0;text-align:right;font-size:12.5px}
  .acct-forgot button{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .acct-forgot button:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="acct-wrap">
  <div class="acct-brand"><a href="/"><img src="../img/brightsite-logo.png" alt="BrightSite"></a></div>
  <div class="acct-card">
    <h1 id="acctTitle">Log in</h1>
    <p class="sub" id="acctSub">Manage your website's services, prices, contact info and photos.</p>

    <form id="acctForm" novalidate>
      <p class="acct-prefill-email" id="acctPrefillEmail">Setting up your account as <strong id="acctPrefillEmailValue"></strong> — <button type="button" id="acctPrefillEmailEdit">not you?</button></p>
      <div class="acct-field" id="emailField">
        <label for="fEmail">Email</label>
        <input type="email" id="fEmail" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="acct-field">
        <label for="fPassword">Password</label>
        <input type="password" id="fPassword" required autocomplete="current-password" placeholder="••••••••" minlength="6">
        <div class="acct-pwd-show">
          <input type="checkbox" id="pwdToggle">
          <label for="pwdToggle">Show password</label>
        </div>
        <p class="acct-forgot" id="forgotWrap"><button type="button" id="forgotBtn">Forgot password?</button></p>
      </div>
      <button type="submit" class="acct-submit" id="acctSubmit">Log in</button>
      <div class="acct-status" id="acctStatus"></div>
    </form>

    <div class="acct-divider">or</div>
    <a href="#" class="acct-google" id="googleBtn">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>

    <div class="acct-toggle">
      <span id="toggleText">Don't have an account?</span>
      <button type="button" id="toggleBtn">Sign up</button>
    </div>
    <div class="acct-toggle" id="backToLogin" style="display:none">
      <button type="button" id="backToLoginBtn">&larr; Back to log in</button>
    </div>
  </div>
  <a href="/" class="acct-back">&larr; Back to BrightSite</a>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://estqrftkrpqlrxnsltgw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_MfwWqSIcsfVE6d5Q7jIxJA_V3Pyf2oP';

  var params = new URLSearchParams(location.search);
  var slugParam = params.get('slug') || '';
  var isSignup = params.get('signup') === '1';
  var emailParam = params.get('email') || '';
  var nameParam = params.get('name') || '';

  var form = document.getElementById('acctForm');
  var title = document.getElementById('acctTitle');
  var sub = document.getElementById('acctSub');
  var submitBtn = document.getElementById('acctSubmit');
  var statusEl = document.getElementById('acctStatus');
  var toggleBtn = document.getElementById('toggleBtn');
  var toggleText = document.getElementById('toggleText');
  var emailField = document.getElementById('emailField');
  var emailInput = document.getElementById('fEmail');
  var passwordInput = document.getElementById('fPassword');
  var prefillEmailEl = document.getElementById('acctPrefillEmail');
  var prefillEmailValueEl = document.getElementById('acctPrefillEmailValue');
  var prefillEmailEditBtn = document.getElementById('acctPrefillEmailEdit');
  var pwdToggle = document.getElementById('pwdToggle');
  var forgotWrap = document.getElementById('forgotWrap');
  var forgotBtn = document.getElementById('forgotBtn');
  var googleWrap = document.querySelector('.acct-divider');
  var isForgot = false;

  // Arriving from the homepage builder, we already know their email —
  // skip re-typing it and go straight to just choosing a password. "not
  // you?" reveals the field again in case the wrong address got carried over.
  function applyEmailPrefill() {
    if (!emailParam) return;
    emailInput.value = emailParam;
    emailField.style.display = 'none';
    prefillEmailValueEl.textContent = emailParam;
    prefillEmailEl.classList.add('show');
    setTimeout(function () { passwordInput.focus(); }, 0);
  }
  applyEmailPrefill();
  prefillEmailEditBtn.addEventListener('click', function () {
    prefillEmailEl.classList.remove('show');
    emailField.style.display = '';
    emailInput.focus();
  });

  pwdToggle.addEventListener('change', function () {
    passwordInput.type = pwdToggle.checked ? 'text' : 'password';
  });

  // If already logged in, go straight to the dashboard.
  try {
    var existing = JSON.parse(localStorage.getItem('bs_session') || 'null');
    // A builder handoff explicitly asks the customer to set a password. Do
    // not let an old browser session bypass that screen.
    if (existing && existing.access_token && !isSignup) {
      location.href = 'dashboard.html' + (slugParam ? ('?slug=' + encodeURIComponent(slugParam)) : '');
      return;
    }
  } catch (e) {}

  function setMode(signup) {
    isForgot = false;
    isSignup = signup;
    passwordInput.closest('.acct-field').style.display = '';
    googleWrap.style.display = '';
    googleBtn.style.display = '';
    document.querySelector('.acct-toggle').style.display = '';
    backToLogin.style.display = 'none';
    if (isSignup) {
      title.textContent = 'Create your account';
      sub.textContent = 'Set up a login so you can manage your own website — services, prices, contact info and photos.';
      submitBtn.textContent = 'Sign up';
      toggleText.textContent = 'Already have an account?';
      toggleBtn.textContent = 'Log in';
      document.querySelector('.acct-toggle').hidden = false;
      document.querySelector('.acct-toggle').style.display = '';
      passwordInput.autocomplete = 'new-password';
      forgotWrap.style.display = 'none';
    } else {
      title.textContent = 'Log in';
      sub.textContent = "Manage your website's services, prices, contact info and photos.";
      submitBtn.textContent = 'Log in';
      toggleText.textContent = "Don't have an account?";
      toggleBtn.textContent = 'Sign up';
      // Accounts only get created via the "send us your preview" handoff
      // (arrives with ?slug=...&signup=1) — no self-serve sign-up for a
      // visitor who just lands on this page directly.
      document.querySelector('.acct-toggle').hidden = !slugParam;
      document.querySelector('.acct-toggle').style.display = '';
      passwordInput.autocomplete = 'current-password';
      forgotWrap.style.display = '';
    }
    statusEl.textContent = '';
    statusEl.className = 'acct-status';
  }

  var backToLogin = document.getElementById('backToLogin');
  var backToLoginBtn = document.getElementById('backToLoginBtn');

  function setForgotMode() {
    isForgot = true;
    title.textContent = 'Reset your password';
    sub.textContent = "We'll email you a link to set a new one.";
    submitBtn.textContent = 'Send reset link';
    submitBtn.disabled = false;
    prefillEmailEl.classList.remove('show');
    emailField.style.display = '';
    passwordInput.closest('.acct-field').style.display = 'none';
    googleWrap.style.display = 'none';
    googleBtn.style.display = 'none';
    document.querySelector('.acct-toggle').style.display = 'none';
    backToLogin.style.display = '';
    statusEl.textContent = '';
    statusEl.className = 'acct-status';
    emailInput.focus();
  }

  toggleBtn.addEventListener('click', function () { setMode(!isSignup); });
  forgotBtn.addEventListener('click', function () { setForgotMode(); });
  backToLoginBtn.addEventListener('click', function () { backToLogin.style.display = 'none'; setMode(false); });

  var googleBtn = document.getElementById('googleBtn');
  googleBtn.addEventListener('click', function (e) {
    e.preventDefault();
    if (slugParam) localStorage.setItem('bs_pending_slug', slugParam);
    var redirectTo = location.origin + '/account/callback.html';
    location.href = SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(redirectTo);
  });

  setMode(isSignup);

  function showStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'acct-status' + (kind ? ' ' + kind : '');
  }

  function friendlyError(data, res) {
    var msg = (data && (data.error_description || data.msg || data.message)) || ('Something went wrong (' + res.status + ')');
    if (/already registered|already exists/i.test(msg)) return 'An account with that email already exists — try logging in instead.';
    if (/invalid login credentials/i.test(msg)) return 'Incorrect email or password.';
    if (/password should be/i.test(msg)) return msg;
    return msg;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (isForgot) {
      var forgotEmail = emailInput.value.trim();
      if (!forgotEmail) { showStatus('Enter your email.', 'err'); return; }
      submitBtn.disabled = true;
      showStatus('Sending…');
      fetch(SUPABASE_URL + '/auth/v1/recover', {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: forgotEmail, options: { redirect_to: location.origin + '/account/reset-password.html' } })
      })
        .then(function () {
          // Supabase always replies 200 here, whether or not the address
          // has an account — never reveal which, so this message covers both.
          showStatus('If that email has an account, a reset link is on its way.', 'ok');
          submitBtn.disabled = false;
        })
        .catch(function () {
          showStatus('Network error — please try again.', 'err');
          submitBtn.disabled = false;
        });
      return;
    }

    var email = emailInput.value.trim();
    var password = passwordInput.value;
    if (!email || !password) { showStatus('Enter your email and password.', 'err'); return; }

    submitBtn.disabled = true;
    showStatus(isSignup ? 'Creating your account…' : 'Logging in…');

    var endpoint = isSignup
      ? SUPABASE_URL + '/auth/v1/signup'
      : SUPABASE_URL + '/auth/v1/token?grant_type=password';

    fetch(endpoint, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { res: res, data: data }; });
      })
      .then(function (r) {
        var res = r.res, data = r.data;
        if (!res.ok) {
          showStatus(friendlyError(data, res), 'err');
          submitBtn.disabled = false;
          return;
        }
        if (isSignup && !data.access_token) {
          // Email confirmation is turned on in the Supabase project —
          // no session yet, tell the user to check their inbox.
          showStatus('Account created! Check your email to confirm it, then log in.', 'ok');
          submitBtn.disabled = false;
          setMode(false);
          return;
        }
        var session = {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          user_id: (data.user && data.user.id) || null,
          email: (data.user && data.user.email) || email
        };
        localStorage.setItem('bs_session', JSON.stringify(session));
        if (isSignup && nameParam) {
          localStorage.setItem('bs_pending_business_name', nameParam);
        }
        if (slugParam) localStorage.setItem('bs_pending_slug', slugParam);
        showStatus('Success — redirecting…', 'ok');
        location.href = 'dashboard.html' + (slugParam ? ('?slug=' + encodeURIComponent(slugParam)) : '');
      })
      .catch(function (err) {
        showStatus('Network error — please try again.', 'err');
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>

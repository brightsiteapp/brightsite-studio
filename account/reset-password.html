<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset your password — BrightSite</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.png" type="image/png">
<meta name="theme-color" content="#F7F2EC">
<link rel="stylesheet" href="../styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .acct-wrap{width:100%;max-width:420px}
  .acct-brand{display:flex;justify-content:center;margin-bottom:26px}
  .acct-brand img{height:40px;width:auto}
  .acct-card{padding:clamp(22px,4vw,32px);border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 12px 30px rgba(23,32,31,.05)}
  .acct-card h1{font-family:var(--display);font-size:clamp(21px,3vw,26px);font-weight:600;line-height:1.15;margin-bottom:6px}
  .acct-card>p.sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:20px}
  .acct-field{margin-bottom:12px}
  .acct-field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
  .acct-field input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:15px;outline:none;transition:border-color .18s ease,box-shadow .18s ease}
  .acct-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .acct-submit{width:100%;margin-top:14px;min-height:48px;padding:0 21px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
  .acct-submit:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(59,130,246,.28)}
  .acct-submit:disabled{opacity:.7;cursor:wait;transform:none;box-shadow:none}
  .acct-status{min-height:20px;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}
  .acct-status.ok{color:var(--accent);font-weight:600}
  .acct-status.err{color:#b23b2c}
  .acct-back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none}
  .acct-back:hover{color:var(--ink)}
  .acct-pwd-wrap{position:relative}
  .acct-pwd-wrap input{padding-right:44px}
  .acct-pwd-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;color:var(--muted);cursor:pointer}
  .acct-pwd-toggle:hover{color:var(--ink);background:rgba(23,32,31,.05)}
</style>
</head>
<body>
<div class="acct-wrap">
  <div class="acct-brand"><a href="/"><img src="../img/brightsite-logo.png" alt="BrightSite"></a></div>
  <div class="acct-card">
    <h1 id="rpTitle">Set a new password</h1>
    <p class="sub" id="rpSub">Choose a new password for your account.</p>

    <form id="rpForm" novalidate>
      <div class="acct-field">
        <label for="fPassword">New password</label>
        <div class="acct-pwd-wrap">
          <input type="password" id="fPassword" required autocomplete="new-password" placeholder="••••••••" minlength="6">
          <button type="button" class="acct-pwd-toggle" id="pwdToggle" aria-label="Show password">
            <svg id="pwdIconShow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pwdIconHide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="acct-submit" id="rpSubmit">Set new password</button>
    </form>
    <div class="acct-status" id="rpStatus"></div>
  </div>
  <a href="login.html" class="acct-back">&larr; Back to log in</a>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://estqrftkrpqlrxnsltgw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_MfwWqSIcsfVE6d5Q7jIxJA_V3Pyf2oP';

  var title = document.getElementById('rpTitle');
  var sub = document.getElementById('rpSub');
  var form = document.getElementById('rpForm');
  var submitBtn = document.getElementById('rpSubmit');
  var statusEl = document.getElementById('rpStatus');
  var passwordInput = document.getElementById('fPassword');
  var pwdToggle = document.getElementById('pwdToggle');
  var pwdIconShow = document.getElementById('pwdIconShow');
  var pwdIconHide = document.getElementById('pwdIconHide');

  pwdToggle.addEventListener('click', function () {
    var showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    pwdIconShow.hidden = !showing;
    pwdIconHide.hidden = showing;
    pwdToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  function showStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'acct-status' + (kind ? ' ' + kind : '');
  }

  function fail(msg) {
    title.textContent = 'Link expired';
    sub.textContent = 'Reset links only work once and expire after a while.';
    form.hidden = true;
    showStatus(msg, 'err');
  }

  // Supabase's recovery redirect carries the token in the URL fragment
  // (never the query string, so it's not logged anywhere server-side).
  var hash = location.hash.replace(/^#/, '');
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  var tokenType = params.get('type');
  var errorDescription = params.get('error_description');

  if (errorDescription) {
    fail(decodeURIComponent(errorDescription.replace(/\+/g, ' ')) + ' Request a new reset link from the log-in page.');
    return;
  }
  if (!accessToken || tokenType !== 'recovery') {
    fail('This reset link is invalid or has already been used. Request a new one from the log-in page.');
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = passwordInput.value;
    if (!password || password.length < 6) { showStatus('Password must be at least 6 characters.', 'err'); return; }

    submitBtn.disabled = true;
    showStatus('Saving…');

    fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
      .then(function (r) {
        if (!r.res.ok) {
          showStatus((r.data && (r.data.msg || r.data.message)) || 'Something went wrong.', 'err');
          submitBtn.disabled = false;
          return;
        }
        showStatus('Password updated — redirecting to log in…', 'ok');
        setTimeout(function () { location.href = 'login.html'; }, 1400);
      })
      .catch(function () {
        showStatus('Network error — please try again.', 'err');
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>

name = "brightsite-us-router"
main = "index.js"
compatibility_date = "2024-09-01"

# Every brightsite.app host goes through this Worker. Wildcard *.brightsite.app DNS is already proxied by Cloudflare.
routes = [
  { pattern = "brightsite.app/*", zone_name = "brightsite.app" },
  { pattern = "us.brightsite.app/*", zone_name = "brightsite.app" },
  { pattern = "uk.brightsite.app/*", zone_name = "brightsite.app" }
]
